# ============================================================
# train_bargaining_rl.py 配置（REINFORCE 自博弈训练）
# 修改此文件即可调参；命令行显式传参时以命令行优先。
# 示例：python train_bargaining_rl.py --reward-mode ttc_calibrated --seed 20260608
# ============================================================

# 训练轮数
epochs: 100
# 学习率
lr: 0.0003
# 折扣因子（论文附录 0.95）
gamma: 0.95
# 熵正则系数
entropy_coef: 0.05

# 与 PPO 共用的奖励定义；比较算法时使用同一模式。
reward_mode: ttc_calibrated

# 可选：以完整 SL 检查点共同初始化状态编码器、议价模块和策略均值。
base_sl_checkpoint: null

# 每个 epoch 内的 episode 数
ep_per_epoch: 5

# 训练中每隔多少个 epoch 做一次内嵌评估，best_policy.pth 按评估分数选点（缺陷③修复）
eval_interval: 10
validation_trials: 5
validation_seed_base: 20261100
test_trials: 25
test_seed_base: 20261200
latency_budget_ms: 50.0

# 训练场景
scenarios: [intersection, chase, merge, head_on]

# 加载预训练权重路径；null = 不加载
load_policy: null

# 固定随机种子；null = 不固定（建议设如 20260608）
seed: null
