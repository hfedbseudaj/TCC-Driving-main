# ============================================================
# train_bargaining_ppo.py 配置（PPO 训练）
# 修改此文件即可调参；命令行显式传参时以命令行优先。
# 示例：python train_bargaining_ppo.py --reward-mode ttc_calibrated --seed 20260608
# ============================================================

# 训练轮数（论文表 3 用 200 轮课程学习）
epochs: 200
# 学习率
lr: 0.0003

# 是否启用课程学习（false 等价于 --no-curriculum）
use_curriculum: true
# 与 REINFORCE 共用的奖励定义；基准比较使用同一模式。
reward_mode: ttc_calibrated

# 可选：以完整 SL 检查点共同初始化状态编码器、议价模块和策略均值。
base_sl_checkpoint: null

# 固定随机种子；null = 不固定（不可复现），建议设如 20260608
seed: null

# PPO 超参
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
ppo_epochs: 10
entropy_init: 0.1
entropy_min: 0.001

# 课程阶段切换的平滑过渡轮数
transition_window: 15

# 每个 epoch 内的 episode 数
ep_per_epoch: 5

# 训练中每隔多少个 epoch 做一次内嵌评估，best_policy.pth 按评估分数选点（缺陷③修复）
eval_interval: 10

# 检查点选择验证集与最终测试集使用不同场景种子。
validation_trials: 5
validation_seed_base: 20261100
test_trials: 25
test_seed_base: 20261200
latency_budget_ms: 50.0

# 课程表：[场景, 持续 epoch]；null 表示全部场景混合
curriculum:
  - [intersection, 40]
  - [chase, 20]
  - [merge, 20]
  - [head_on, 40]
  - [null, 80]
